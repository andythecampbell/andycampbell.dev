<!--
  Deliberately thin. The Contact section directly above carries the links; a
  footer repeating them would show the same three addresses twice inside one
  screen height, which reads as padding rather than thoroughness.
-->
<footer class="border-t border-rule">
  <div
    class="mx-auto flex max-w-5xl flex-wrap items-baseline justify-between gap-x-6 gap-y-3 px-6 py-10"
  >
    <p class="font-mono text-xs text-ink-muted">{{ site.location }} · {{ year }}</p>

    <a
      href="#top"
      class="font-mono text-xs tracking-widest text-ink-muted uppercase transition-colors hover:text-accent focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent"
    >
      Back to top
    </a>
  </div>
</footer>
